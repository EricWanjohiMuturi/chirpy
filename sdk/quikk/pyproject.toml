[project]
name = "quikk"
version = "0.1.0"
description = "Quikk: the official Python SDK for Chirpy, a language-agnostic standalone job server built on apalis."
authors = [
    { name = "Muturi Eric Wanjohi", email = "emuturi124@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.13.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
prod = [
    "anyio>=4.13.0",
    "pydantic>=2.13.4",
]
dev = [
    "pytest>=9.0.3",
    "pytest-timeout>=2.4.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quikk"]
